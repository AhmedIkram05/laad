services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-atm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atm_user} -d ${POSTGRES_DB:-atm_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - TEST_POSTGRES_HOST=postgres_test
      - TEST_POSTGRES_PORT=5432
      - TEST_POSTGRES_DB=atm_platform_test
      - TEST_POSTGRES_USER=atm_user
      - TEST_POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/docs\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/src/anomaly_detection/ml/artifacts:/app/backend/src/anomaly_detection/ml/artifacts
      - ./data:/app/data

  generator:
    build: .
    command: python -m backend.generator.continuous_generator
    profiles:
      - generator
    environment:
      - TICK_SECONDS=1
      - BACKFILL_MINUTES=${BACKFILL_MINUTES:-60}
      - ANOMALY_PROB=${ANOMALY_PROB:-0.02}
      - GENERATOR_SEED=${GENERATOR_SEED}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5434
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    profiles:
      - ml
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/artifacts/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

  postgres_test:
    image: postgres:16-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-atm_platform_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-atm_user}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  pytest:
    build: .
    profiles:
      - test
    command: >
      sh -c "sleep 3 &&
      python -c 'from backend.src.database.init_db import init_db; init_db()' &&
      python -m pytest backend/tests/ -v
      --ignore=backend/tests/test_atm_app_parser.py
      --ignore=backend/tests/test_gcp_cloud_metrics_parser.py
      --ignore=backend/tests/test_hardware_sensor_parser.py
      --ignore=backend/tests/test_kafka_metrics_parser.py
      --ignore=backend/tests/test_ingestion_integration.py
      --ignore=backend/tests/test_prometheus_parser.py
      --ignore=backend/tests/test_terminal_handler_parser.py
      --ignore=backend/tests/test_windows_os_parser.py
      --ignore=backend/tests/test_db_schema.py
      --ignore=backend/tests/test_db_connection_pragmas.py
      --tb=short"
    environment:
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${TEST_POSTGRES_DB:-atm_platform_test}
      - POSTGRES_USER=${TEST_POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-your_password_here}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ML_HEURISTICS_ENABLED=true
      - ML_RULES_DETECTION_ENABLED=true
    depends_on:
      - postgres_test
    volumes:
      - ./backend:/app/backend
      - ./backend/src/anomaly_detection/ml/artifacts:/app/backend/src/anomaly_detection/ml/artifacts
      - ./backend/custom_synthetic_data_sources:/app/backend/custom_synthetic_data_sources

volumes:
  postgres_data:
  mlflow_artifacts:
  postgres_test_data:
