services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-atm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atm_user} -d ${POSTGRES_DB:-atm_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    user: root
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: "/bitnami/kafka"
      CLUSTER_ID: "80CbQ_gJS-qyg-JUs8tqZg"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "/usr/bin/kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic atm-events --partitions 3 --replication-factor 1 && \
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic atm-metrics --partitions 3 --replication-factor 1 && \
        echo "Kafka topics created: atm-events, atm-metrics"
    restart: "no"

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  kafka-consumer:
    build: .
    command: python -m backend.kafka.consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=atm-platform-consumer
      - KAFKA_AUTO_OFFSET_RESET=latest
      - ANOMALY_TRIGGER_INTERVAL_S=30
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_WINDOW_SIZE=10
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RAG_PRIMARY_MODEL=${RAG_PRIMARY_MODEL:-gemini-2.0-flash}
      - RAG_FALLBACK_MODEL=${RAG_FALLBACK_MODEL:-groq/llama-3.1-70b-versatile}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SAMPLES=${RAG_SAMPLES:-3}
      - RAG_TEMPERATURE=${RAG_TEMPERATURE:-0.6}
      - CONF_HIGH=${CONF_HIGH:-0.8}
      - CONF_MEDIUM=${CONF_MEDIUM:-0.5}
      - RAG_CALIBRATION_ENABLED=${RAG_CALIBRATION_ENABLED:-true}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - TEST_POSTGRES_HOST=postgres_test
      - TEST_POSTGRES_PORT=5432
      - TEST_POSTGRES_DB=atm_platform_test
      - TEST_POSTGRES_USER=atm_user
      - TEST_POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/docs\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/src/anomaly_detection/ml/artifacts:/app/backend/src/anomaly_detection/ml/artifacts
      - ./data:/app/data

  generator:
    build: .
    command: python -m backend.generator.continuous_generator
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TICK_SECONDS=1
      - BACKFILL_MINUTES=${BACKFILL_MINUTES}
      - ANOMALY_PROB=${ANOMALY_PROB}
      - GENERATOR_SEED=${GENERATOR_SEED}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    profiles:
      - ml
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/artifacts/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

  postgres_test:
    image: postgres:16-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-atm_platform_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-atm_user}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  pytest:
    build: .
    profiles:
      - test
    command: >
      sh -c "sleep 3 &&
      python -c 'from backend.src.database.init_db import init_db; init_db(force=True)' &&
      python -m pytest backend/tests/ -v
      --ignore=backend/tests/test_kafka_producer.py
      --tb=short"
    environment:
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${TEST_POSTGRES_DB:-atm_platform_test}
      - POSTGRES_USER=${TEST_POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-your_password_here}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ML_HEURISTICS_ENABLED=true
      - ML_RULES_DETECTION_ENABLED=true
    depends_on:
      - postgres_test
    volumes:
      - ./backend:/app/backend
      - ./backend/src/anomaly_detection/ml/artifacts:/app/backend/src/anomaly_detection/ml/artifacts
      - ./backend/custom_synthetic_data_sources:/app/backend/custom_synthetic_data_sources

volumes:
  postgres_data:
  mlflow_artifacts:
  postgres_test_data:
  kafka_data:
  chroma_data:
