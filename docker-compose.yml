services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-atm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atm_user} -d ${POSTGRES_DB:-atm_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    user: root
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_DIRS: "/bitnami/kafka"
      CLUSTER_ID: "80CbQ_gJS-qyg-JUs8tqZg"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "/usr/bin/kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic atm-events --partitions 3 --replication-factor 1 && \
        /usr/bin/kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic atm-metrics --partitions 3 --replication-factor 1 && \
        echo "Kafka topics created: atm-events, atm-metrics"
    restart: "no"

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama server..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling nomic-embed-text model..."
        ollama pull nomic-embed-text
        echo "Model pulled successfully"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  kafka-consumer:
    build: ./backend
    command: python -m backend.kafka.consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=atm-platform-consumer
      - KAFKA_AUTO_OFFSET_RESET=latest
      - ANOMALY_TRIGGER_INTERVAL_S=30
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_WINDOW_SIZE=10
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_CACHE_TTL=${REDIS_CACHE_TTL:-300}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.inference.wandb.ai/v1}
      - LLM_API_KEY=${WANDB_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-31B-it}
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_SAMPLES=${RAG_SAMPLES:-3}
      - RAG_TEMPERATURE=${RAG_TEMPERATURE:-0.6}
      - CONF_HIGH=${CONF_HIGH:-0.8}
      - CONF_MEDIUM=${CONF_MEDIUM:-0.5}
      - RAG_CHUNK_TRUNCATE=${RAG_CHUNK_TRUNCATE:-800}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_CACHE_TTL=${REDIS_CACHE_TTL:-300}
      - TEST_POSTGRES_HOST=postgres_test
      - TEST_POSTGRES_PORT=5432
      - TEST_POSTGRES_DB=atm_platform_test
      - TEST_POSTGRES_USER=atm_user
      - TEST_POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-your_password_here}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/docs\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data

  mcp-server:
    build: ./backend
    command: python -m backend.src.mcp.server --transport http
    ports:
      # Host port 8001 is taken by chromadb (8001:8000); the server stays on
      # container port 8001, so internal MCP_SERVER_URL=http://mcp-server:8001/mcp is unchanged.
      - "8002:8001"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.inference.wandb.ai/v1}
      - LLM_API_KEY=${WANDB_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-31B-it}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      chromadb:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\", 8001), 2); s.close()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend

  generator:
    build: ./backend
    command: python -m backend.generator.continuous_generator
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TICK_SECONDS=1
      - BACKFILL_MINUTES=${BACKFILL_MINUTES}
      - ANOMALY_PROB=${ANOMALY_PROB}
      - GENERATOR_SEED=${GENERATOR_SEED}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-atm_platform}
      - POSTGRES_USER=${POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend

  mlflow:
    build: ./mlflow
    profiles:
      - ml
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/artifacts/mlflow.db}
      --default-artifact-root ${MLFLOW_S3_ARTIFACT_ROOT:-/mlflow/artifacts}
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --gunicorn-opts "--timeout 120 --workers 2"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - MLFLOW_S3_UPLOAD_EXTRA_ARGS={"ServerSideEncryption":"AES256"}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres_test:
    image: postgres:16-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-atm_platform_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-atm_user}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-your_password_here}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  pytest:
    build: ./backend
    profiles:
      - test
    command: >
      sh -c "sleep 3 &&
      python -c 'from backend.src.database.init_db import init_db; init_db(force=True)' &&
      python -m pytest backend/tests/ -v
      --tb=short
      --ignore=backend/tests/stress
      --cov=backend/src --cov=backend/generator --cov=backend/kafka
      --cov-report=term --cov-report=term-missing
      --cov-report=xml:/app/backend/coverage.xml &&
      echo '--- Running stress tests ---' &&
      python -c 'from backend.src.database.init_db import init_db; init_db(force=True)' &&
      python -m pytest backend/tests/stress/ -v --tb=short"
    environment:
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${TEST_POSTGRES_DB:-atm_platform_test}
      - POSTGRES_USER=${TEST_POSTGRES_USER:-atm_user}
      - POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-your_password_here}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ML_HEURISTICS_ENABLED=true
      - ML_RULES_DETECTION_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TTL=300
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-test-secret-key-for-laad}
      - TEST_DATA_DIR=backend/custom_synthetic_data_sources
      - STRESS_TEST_BASE_URL=http://backend:8000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.inference.wandb.ai/v1}
      - LLM_API_KEY=${WANDB_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-31B-it}
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_SAMPLES=${RAG_SAMPLES:-3}
      - RAG_TEMPERATURE=${RAG_TEMPERATURE:-0.6}
      - RAG_REFLEXION=${RAG_REFLEXION:-true}
      - RAG_SELF_CONSISTENCY=${RAG_SELF_CONSISTENCY:-true}
      - RAG_CITATION_GROUNDING=${RAG_CITATION_GROUNDING:-true}
      - RAG_CROSS_ENCODER=${RAG_CROSS_ENCODER:-true}
      - RAG_ERROR_ONLY=${RAG_ERROR_ONLY:-true}
      - RAG_CHUNK_TRUNCATE=${RAG_CHUNK_TRUNCATE:-800}
      - RAG_HYBRID_TOP_K=${RAG_HYBRID_TOP_K:-5}
      # 0 disables the global client-side rate limiter: eval hits the LLM
      # hundreds of times per run and 20 req/min was throttling it to death.
      - RAG_RATE_LIMIT=${RAG_RATE_LIMIT:-0}
      # Eval-only judge model for the RAGAS scoring phase (plan §2.1): a cheap
      # fast model judges; queries keep using LLM_MODEL so deltas stay
      # retrieval-only. Must exist on W&B Serverless Inference (verified via
      # GET /v1/models) — Phi-4-mini-instruct does NOT.
      - RAG_JUDGE_MODEL=${RAG_JUDGE_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
    depends_on:
      postgres_test:
        condition: service_started
      redis:
        condition: service_started
      chromadb:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      - ./backend/src/anomaly_detection/ml/artifacts:/app/backend/src/anomaly_detection/ml/artifacts
      - ./backend/custom_synthetic_data_sources:/app/backend/custom_synthetic_data_sources

  frontend-test:
    image: node:22-alpine
    profiles:
      - test
    working_dir: /frontend
    command: >
      sh -c "cp -r /src/. /frontend/ && cd /frontend && npm ci && npx vitest run --coverage && cp -r coverage /src/coverage"
    volumes:
      - ./frontend:/src

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    profiles:
      - test
    working_dir: /workspace
    command: >
      sh -c "npm init -y --silent 2>/dev/null &&
             npm install --silent @playwright/test 2>/dev/null &&
             npx playwright test --reporter=list"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./frontend/playwright.config.js:/workspace/playwright.config.js
      - ./frontend/e2e:/workspace/e2e
    environment:
      BASE_URL: http://frontend:80

volumes:
  postgres_data:
  mlflow_artifacts:
  postgres_test_data:
  kafka_data:
  chroma_data:
  redis_data:
  ollama_data:
