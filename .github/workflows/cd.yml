name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-2
  ECR_REPO: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # ── Check if deployable code actually changed ─────────────────────
  should-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout with depth 2 (to diff against parent)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect deployable changes
        id: check
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "━━━ Files changed in this commit ━━━"
          echo "$CHANGED_FILES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if echo "$CHANGED_FILES" | grep -q -E '^(backend/|frontend/|terraform/|docker-compose.yml|Makefile|\.github/workflows/cd\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "→ Deployable changes detected."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "→ Only docs/config/other changed — skipping deploy."
          fi

  # ── Deploy to AWS ECS ────────────────────────────────────────────
  deploy:
    needs: should-deploy
    if: needs.should-deploy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout the commit that triggered CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.event.workflow_run.head_sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Build once with cache, tag all variants, push once
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t $ECR_REGISTRY/$ECR_REPO:api-latest \
            -t $ECR_REGISTRY/$ECR_REPO:consumer-latest \
            -t $ECR_REGISTRY/$ECR_REPO:generator-latest \
            -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG \
            --load \
            backend/

          docker push --all-tags $ECR_REGISTRY/$ECR_REPO

          # Move cache so it doesn't grow indefinitely
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build frontend
        run: |
          npm ci
          VITE_API_URL=${{ secrets.API_URL }} npm run build
        working-directory: frontend

      - name: Sync frontend to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} --delete
        working-directory: frontend

      - name: Force ECS deploy — API
        run: |
          aws ecs update-service --cluster laad-cluster \
            --service laad-api --force-new-deployment

      - name: Force ECS deploy — Consumer
        run: |
          aws ecs update-service --cluster laad-cluster \
            --service laad-consumer --force-new-deployment

      - name: Force ECS deploy — Generator
        run: |
          aws ecs update-service --cluster laad-cluster \
            --service laad-generator --force-new-deployment

      - name: Smoke test — verify API health
        run: |
          # Wait for ECS services to finish rolling update
          aws ecs wait services-stable --cluster laad-cluster \
            --services laad-api laad-consumer laad-generator

          # Health check against ALB
          curl -f -s -o /dev/null -w "API health: %{http_code}\n" \
            ${{ secrets.API_URL }}/health || {
            echo "API health check failed — deployment may be unhealthy"
            exit 1
          }

      - name: Initialize database schema (idempotent)
        run: |
          # Extract network config from the stable API service
          NETWORK_CONFIG=$(aws ecs describe-services --cluster laad-cluster --services laad-api \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)

          echo "Network config: $(echo $NETWORK_CONFIG | jq -c '{subnets, securityGroups}')"

          TASK_ARN=$(aws ecs run-task \
            --cluster laad-cluster \
            --task-definition laad-api \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","-c","from backend.src.database.init_db import init_db; init_db(force=False)"]}]}' \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Schema init task: $TASK_ARN"

          # Wait for task to finish
          aws ecs wait tasks-stopped --cluster laad-cluster --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster laad-cluster --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Schema init FAILED with exit code $EXIT_CODE"
            exit 1
          fi

          echo "Schema init completed (exit code 0)"
