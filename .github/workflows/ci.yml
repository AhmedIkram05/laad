name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect changed paths ──────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'terraform/**'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'terraform/**'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # ── Lint & Security (fast, always runs) ──────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend/

      - name: Audit dependencies for CVEs
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --desc on --ignore-vuln CVE-2026-45829

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          skip-dirs: node_modules,frontend/node_modules,.git

  # ── Dependency Review (supply chain security) ────────────────────
  deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # post results on the PR
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  # ── Backend tests (only on backend changes) ──────────────────────
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atm_platform
          POSTGRES_USER: atm_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Initialize database schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: atm_platform
          POSTGRES_USER: atm_user
          POSTGRES_PASSWORD: test_password
          LAAD_ENV: production
        run: python -c "from backend.src.database.init_db import init_db; init_db()"

      - name: Run backend tests
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_DB: atm_platform
          TEST_POSTGRES_USER: atm_user
          TEST_POSTGRES_PASSWORD: test_password
          JWT_SECRET_KEY: ci-test-secret-key-for-laad-pipeline
          LAAD_ENV: production
        run: |
          python -m pytest backend/tests/ -v --tb=short \
            --ignore=backend/tests/stress \
            --ignore=backend/tests/integration \
            -k "not chroma and not rag and not kafka" \
            --cov=backend/src --cov-report=term-missing --cov-report=xml:coverage-backend.xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage-backend.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Frontend tests (only on frontend changes) ────────────────────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npx vitest run --coverage
        working-directory: frontend

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Playwright E2E tests (on frontend or backend changes) ─────────
  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atm_platform
          POSTGRES_USER: atm_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Initialize database schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: atm_platform
          POSTGRES_USER: atm_user
          POSTGRES_PASSWORD: test_password
          LAAD_ENV: production
        run: python -c "from backend.src.database.init_db import init_db; init_db()"

      - name: Start FastAPI backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: atm_platform
          POSTGRES_USER: atm_user
          POSTGRES_PASSWORD: test_password
          JWT_SECRET_KEY: ci-test-secret-key-for-laad-pipeline
          LAAD_ENV: production
        run: |
          uvicorn backend.src.api.server:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install -g serve
          serve -s dist -l 5173 &
          sleep 3

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm init -y --silent
          npm install @playwright/test
          npx playwright install chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5173
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
