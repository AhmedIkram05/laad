# RAG eval gate — plan §7.6 / D14.
#
# Runs the RAGAS evaluation on PRs and the default branch, compares against the
# committed baseline (docs/eval/baseline.json), fails the check on regression,
# and uploads the per-run results as an artifact.
#
# Neutral (green) when neither WANDB_API_KEY nor OPENROUTER_API_KEY secret
# exists — the LLM + embedding stack is unreachable without one, so there is
# nothing to gate. Neutrality is loud: a ::warning:: annotation is emitted on
# the skip path. Add either secret to enable gating (OpenRouter alone works —
# it is in the chat provider list). Bump the timeout if the golden set grows.

name: RAG Eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fail-closed setup (no provider key -> neutral)
        if: env.WANDB_API_KEY == '' && env.OPENROUTER_API_KEY == ''
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "::warning::RAG eval gate skipped: no WANDB_API_KEY or OPENROUTER_API_KEY secret — eval did not run, no regression check."
          echo "No provider key secret (WANDB_API_KEY / OPENROUTER_API_KEY); skipping RAG eval gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Start eval services
        if: env.WANDB_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          docker compose --profile test up -d \
            postgres_test chromadb redis ollama ollama-init mcp-server
          docker compose run --rm backend \
            python -m backend.tests.eval.seed

      - name: Run RAG eval against committed baseline
        if: env.WANDB_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          make eval-ragas FLAGS="--ci"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: |
            backend/tests/eval/results.json
            docs/eval/baseline.json
            eval_results/
          if-no-files-found: warn