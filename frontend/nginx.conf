# nginx configuration for LAAD frontend
# Replicates Vite's proxy logic for production deployment
#
# Original Vite proxy logic:
# - /api/rag → backend:8000
# - /api/analytics → backend:8000
# - /api/insights/* → rewrite to /api/analytics/* → backend:8000
# - /api/* → strip "/api" prefix → backend:8000
# - /auth → backend:8000
# - SPA fallback: all other paths → index.html

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Configure proper MIME types
    include /etc/nginx/mime.types;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ── API Proxy Routes (order matters - more specific first) ──────────

    # /api/rag - pass through to backend
    location /api/rag {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/analytics - pass through to backend
    location /api/analytics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/insights - rewrite to /api/analytics (backward compatibility)
    location /api/insights {
        rewrite ^/api/insights(.*)$ /api/analytics$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* catch-all - strip "/api" prefix then forward to backend
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /auth - pass through to backend (no prefix stripping)
    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static Files ─────────────────────────────────────────────────────

    # Explicitly handle static assets with proper caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA Fallback ─────────────────────────────────────────────────────

    # For React Router SPA: serve index.html for any non-asset path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
