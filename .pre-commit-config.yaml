# Pre-commit hooks mirroring CI lint/security checks.
# Install:  pre-commit install
# Run all:  pre-commit run --all-files
# Skip:     SKIP=hook_id git commit -m "..."

repos:
  # ── Basic file hygiene ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Python lint (mirrors CI: ruff check backend/) ────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # ── Terraform compliance (mirrors CI: checkov) ───────────────────
  # NOTE: soft-fail in pre-commit; CI enforces via soft_fail: false in ci.yml
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.0
    hooks:
      - id: checkov
        args: [--compact, --quiet, --soft-fail]
        files: \.tf$
        exclude: \.terraform\/.*$
