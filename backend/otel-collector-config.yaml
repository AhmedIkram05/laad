# OpenTelemetry Collector: OTLP in -> Jaeger out (docs/adr/0001).
# Vendor-neutral by construction; the swap later is this exporter line.
# Traces only. No debug exporter — the runtime smoke test
# against the Jaeger API is the tripwire instead.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp:
    endpoint: http://jaeger:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp]
