# Checkov IaC compliance configuration for LAAD
#
# Suppresses all known/accepted dev-environment baseline failures.
# Any NEW check ID not in this list is a regression — the CI pipeline's
# pytest test (test_checkov_compliance.py) enforces this.
#
# Inline # checkov:skip= comments exist in module files for documentation
# but are NOT honoured by checkov 3.3.0 (confirmed via test). This config
# file is the actual suppression mechanism.

skip-path:
  - tests

skip-check:
  # ── Bootstrap: DynamoDB state lock (dev only, no PITR/KMS needed) ──
  - CKV_AWS_28
  - CKV_AWS_119

  # ── ECR: dev registry, mutable tags, no KMS ──
  - CKV_AWS_51
  - CKV_AWS_136

  # ── ECS: CloudWatch log groups, ALB, task definitions (dev) ──
  - CKV_AWS_2
  - CKV_AWS_91
  - CKV_AWS_131
  - CKV_AWS_150
  - CKV_AWS_158
  - CKV_AWS_336
  - CKV_AWS_338
  - CKV_AWS_378
  - CKV2_AWS_20
  - CKV2_AWS_28
  - CKV_AWS_103

  # ── Frontend: CloudFront / S3 (dev, behind OAC) ──
  - CKV_AWS_68
  - CKV_AWS_86
  - CKV_AWS_174
  - CKV_AWS_310
  - CKV_AWS_374
  - CKV2_AWS_32
  - CKV2_AWS_42
  - CKV2_AWS_47

  # ── S3: tf_state + frontend buckets (dev, no lifecycle/events/notifications) ──
