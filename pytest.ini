[pytest]
markers =
    rag: RAG pipeline tests (de-select manually via -m "not rag")
    kafka: Kafka integration tests (de-select manually via -m "not kafka")
    chroma: Chroma vector-store tests (de-select manually via -m "not chroma")
    analytics: analytics router tests
    anomaly: anomaly detection tests
filterwarnings =
    # Third-party deprecation noise — not our code, no maintained upstream
    # replacement available, so filter instead of chasing dead ends:
    # starlette's vendored TestClient still references the old anyio alias.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning
    # langchain-experimental is sunset with no drop-in for SemanticChunker.
    ignore:`langchain-experimental` is being sunset.*:DeprecationWarning
    # Emitted from inside langchain-experimental's own import chain.
    ignore:`langchain-community` is being sunset.*:DeprecationWarning
    # ragas smoke test pins the working wrapper API; migration to
    # embedding_factory changes evaluated behavior, so filter the notice.
    ignore:.*LangchainEmbeddingsWrapper is deprecated.*:DeprecationWarning
    # Fired from inside ragas when the smoke test calls evaluate().
    # Migrating to @experiment is a separate task; the call still works.
    ignore:.*evaluate\(\) is deprecated.*:DeprecationWarning
    ignore:.*aevaluate\(\) is deprecated.*:DeprecationWarning
    # chromadb's vendored telemetry uses asyncio.iscoroutinefunction,
    # deprecated in newer Pythons. Upstream's to fix on their release line.
    ignore:.*asyncio\.iscoroutinefunction.*is deprecated.*:DeprecationWarning
